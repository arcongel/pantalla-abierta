name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Compilar
        run: gradle assembleRelease --no-daemon

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk PantallaAbierta.apk

      - name: Guardar APK en la ejecución
        uses: actions/upload-artifact@v4
        with:
          name: PantallaAbierta-apk
          path: PantallaAbierta.apk

      - name: Publicar en Releases (descarga directa)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Pantalla Abierta 1.0.${{ github.run_number }}
          files: PantallaAbierta.apk
